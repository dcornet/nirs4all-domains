name: Domains browser qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            bindings/wasm/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Windows' && '3.11.9' || '3.11.18' }}
          cache: pip
          cache-dependency-path: |
            ci/python-constraints.txt
            bridges/python/pyproject.toml
      - name: Install pinned Python package installer
        run: python -m pip install pip==26.3
      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix demo
      - name: Install binding's direct provider dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix bindings/wasm
      - run: npm run typecheck --prefix demo
      - run: npm test --prefix demo
      - run: npm run test:build-tools --prefix demo
      - name: Install reference interpreter and the exact native comparison provider
        run: python -m pip install -c ci/python-constraints.txt nirs4all-methods==1.3.13 './bridges/python[test]'
      - name: Select the original native Methods library and companion directory
        shell: pwsh
        run: |
          $lib = python -c "from n4m._ffi import library_path; print(library_path())"
          "N4DOMAINS_METHODS_LIBRARY=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $dlls = Join-Path $site 'nirs4all_methods.libs'
          if (Test-Path $dlls) { $dlls | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Regenerate and verify only public saved examples
        shell: pwsh
        run: |
          python scripts/prepare_demo_examples.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_demo_examples.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- demo/public/examples
      - run: cargo fmt --all --check
      - run: cargo test --locked -p nirs4all-domains --no-default-features --test browser
      - run: cargo clippy --locked -p nirs4all-domains --target wasm32-unknown-unknown --no-default-features --features browser-wasm -- -D warnings
      - name: Install official wasm-pack binary
        run: python scripts/install_wasm_pack.py
      - name: Install the pinned engineering memory sampler
        run: python -m pip install -c ci/python-constraints.txt -r ci/benchmark-requirements.txt
      - name: Build actual Domains Rust WASM
        timeout-minutes: 15
        run: python scripts/observe_wasm_build.py
      - name: Exercise actual compiled WASM and published Methods
        run: npm test --prefix bindings/wasm
      - name: Exercise the native public provider on exactly the same synthetic fixtures
        shell: pwsh
        run: |
          python -c "import pathlib,subprocess; p=pathlib.Path('demo/test-results/native-parity.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(subprocess.check_output(['cargo','run','--quiet','--locked','-p','nirs4all-domains','--example','browser_parity','--','bindings/wasm/tests/parity-fixtures.json']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_browser_parity.py --native demo/test-results/native-parity.json --wasm demo/test-results/wasm-parity.json
      - name: Replay scoped synthetic wire requests through the native public provider and compare actual WASM
        shell: pwsh
        run: |
          python -c "import pathlib,subprocess; p=pathlib.Path('demo/test-results/scoped-native-parity.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(subprocess.check_output(['cargo','run','--quiet','--locked','-p','nirs4all-domains','--example','browser_scoped_parity','--','bindings/wasm/tests/scoped-fixtures.json']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:N4DOMAINS_SCOPED_NATIVE_PARITY_IN = 'demo/test-results/scoped-native-parity.json'
          node --test bindings/wasm/tests/scoped-actual-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute F4.1 synthetic factor protocol with actual WASM and published Methods
        run: node bindings/wasm/tests/factor-protocol.mjs wasm demo/test-results/factor-wasm.json
      - name: Replay identical recorded factor score requests natively and compare scientific outputs
        shell: pwsh
        run: |
          python -c "import pathlib,subprocess; p=pathlib.Path('demo/test-results/factor-native.json'); p.write_bytes(subprocess.check_output(['cargo','run','--quiet','--locked','-p','nirs4all-domains','--example','browser_factor_qualification','--','demo/test-results/factor-wasm.json']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node bindings/wasm/tests/factor-protocol.mjs compare demo/test-results/factor-wasm.json demo/test-results/factor-native.json demo/test-results/factor-parity-receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build --prefix demo
      - name: Install supported hosted browser engines
        working-directory: demo
        run: npx playwright-core install --with-deps chromium firefox
      - name: Real WASM, IO, worker, offline export and responsive browser tests
        env:
          DOMAINS_TEST_FIREFOX: '1'
        run: npm run test:browser --prefix demo
      - name: Install hash-locked PDF inspection tool (test only)
        run: python -m pip install --no-deps --require-hashes -r ci/pdf-review-requirements.txt
      - name: Inspect actual selected A4/Letter PDFs and rasterize representative pages
        run: python scripts/review_export_selection_pdfs.py
      - name: Inspect actual F4.1 factor A4/Letter tables and rasterize scientific pages
        run: python scripts/review_factor_pdfs.py
      - name: Verify bounded distributable without private artifacts
        run: python scripts/check_demo_distribution.py
      - name: Build the exact F2 comparison frontend and its original Rust WASM
        timeout-minutes: 15
        run: python scripts/build_browser_baseline.py
      - name: Same-host before and after browser measurements
        shell: pwsh
        run: |
          python scripts/run_browser_benchmark.py --dist "$env:RUNNER_TEMP/domains-f3-baseline/demo/dist" --out demo/test-results/technical-before.json --label F2-f4289f5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_browser_benchmark.py --dist demo/dist --out demo/test-results/technical-after.json --label F3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/compare_browser_benchmarks.py demo/test-results/technical-before.json demo/test-results/technical-after.json demo/test-results/technical-comparison.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify reproducible notices and source identity
        run: git diff --exit-code -- demo/public/licenses demo/DEPENDENCIES.md
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: github-pages-f3-preview
          path: demo/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domains-browser-proof-${{ matrix.os }}
          path: demo/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domains-generated-notices-${{ matrix.os }}
          path: |
            demo/public/licenses
            demo/DEPENDENCIES.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domains-demo-preview-${{ matrix.os }}
          path: demo/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: domains-wasm-binding-${{ matrix.os }}
          path: bindings/wasm/native/
          if-no-files-found: warn
