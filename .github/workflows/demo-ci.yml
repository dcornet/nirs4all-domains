name: Domains browser qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference interpreter and the exact native comparison provider
        run: python -m pip install nirs4all-methods==1.3.13 './bridges/python[test]'
      - name: Select the original native Methods library and companion directory
        shell: pwsh
        run: |
          $lib = python -c "from n4m._ffi import library_path; print(library_path())"
          "N4DOMAINS_METHODS_LIBRARY=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $dlls = Join-Path $site 'nirs4all_methods.libs'
          if (Test-Path $dlls) { $dlls | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Regenerate and verify only public saved examples
        shell: pwsh
        run: |
          python scripts/prepare_demo_examples.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_demo_examples.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- demo/public/examples
      - run: cargo fmt --all --check
      - run: cargo test --locked -p nirs4all-domains --no-default-features --test browser
      - run: cargo clippy --locked -p nirs4all-domains --target wasm32-unknown-unknown --no-default-features --features browser-wasm -- -D warnings
      - name: Install official wasm-pack binary
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'x86_64-pc-windows-msvc' } else { 'x86_64-unknown-linux-musl' }
          $archive = "wasm-pack-v0.13.1-$platform.tar.gz"
          Invoke-WebRequest "https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/$archive" -OutFile "$env:RUNNER_TEMP/$archive"
          tar -xzf "$env:RUNNER_TEMP/$archive" -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/wasm-pack-v0.13.1-$platform" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build actual Domains Rust WASM
        run: npm run build:native --prefix bindings/wasm
      - name: Install locked browser dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix demo
      - name: Install binding's direct provider dependency
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix bindings/wasm
      - name: Exercise actual compiled WASM and published Methods
        run: npm test --prefix bindings/wasm
      - name: Exercise the native public provider on exactly the same synthetic fixtures
        shell: pwsh
        run: |
          python -c "import pathlib,subprocess; p=pathlib.Path('demo/test-results/native-parity.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(subprocess.check_output(['cargo','run','--quiet','--locked','-p','nirs4all-domains','--example','browser_parity','--','bindings/wasm/tests/parity-fixtures.json']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_browser_parity.py --native demo/test-results/native-parity.json --wasm demo/test-results/wasm-parity.json
      - run: npm run typecheck --prefix demo
      - run: npm test --prefix demo
      - run: npm run build --prefix demo
      - name: Verify reproducible notices and source identity
        run: git diff --exit-code -- demo/public/licenses demo/DEPENDENCIES.md
      - name: Install hosted Chromium
        working-directory: demo
        run: npx playwright-core install --with-deps chromium
      - name: Real WASM, IO, worker, offline export and responsive browser tests
        run: npm run test:browser --prefix demo
      - name: Verify bounded distributable without private artifacts
        run: python scripts/check_demo_distribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domains-browser-proof-${{ matrix.os }}
          path: demo/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: domains-demo-preview-${{ matrix.os }}
          path: demo/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domains-wasm-binding-${{ matrix.os }}
          path: bindings/wasm/native/
          if-no-files-found: warn
