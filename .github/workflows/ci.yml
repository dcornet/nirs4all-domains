name: scientific-gates
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install nirs4all-methods==1.3.6 "./bridges/python[test,datasets,predictive]"
      - name: Select native Methods and companion DLL directory
        shell: pwsh
        run: |
          $lib = python -c "from n4m._ffi import library_path; print(library_path())"
          "N4DOMAINS_METHODS_LIBRARY=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $dlls = Join-Path $site 'nirs4all_methods.libs'
          if (Test-Path $dlls) { $dlls | Out-File -FilePath $env:GITHUB_PATH -Append }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked -- --ignored
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo build --workspace --locked
      - run: cargo run --locked -p nirs4all-domains-cli -- schema --out schemas
      - run: python scripts/generate_bank_schemas.py
      - name: Bridge and end-to-end gates
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:N4DOMAINS_BIN = Join-Path $PWD "target/debug/n4domains$suffix"
          python -m unittest discover -s tests/integration -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m nirs4all_domains.bank verify --manifest docs/benchmarks/alpha8/storage.json --root docs/benchmarks/alpha8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m nirs4all_domains.bank query --registry docs/benchmarks/alpha8 --purpose structure_sensitive_challenge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m nirs4all_domains.bank plan-task --task tests/fixtures/dependence/mixed.json --config configs/pilots/split-stress-controls-v1.json --out results/bank-plan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m nirs4all_domains.bank estimate --plan results/bank-plan.json --policy configs/bank/storage-policy-alpha8.json --workspace . --scratch results/bank-scratch --evidence results/bank-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:N4DOMAINS_BIN analyze tests/fixtures/translation.json --out results/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_report.py results/ci/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:N4DOMAINS_BIN structure tests/fixtures/structure/separated.json --config configs/pilots/structure-v1.json --out results/structure-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_structure_report.py results/structure-ci/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:N4DOMAINS_BIN dependence tests/fixtures/dependence/mixed.json --config configs/pilots/dependence-controls-v1.json --out results/dependence-ci --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_dependence_report.py results/dependence-ci/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:N4DOMAINS_BIN split-stress tests/fixtures/dependence/mixed.json --config configs/pilots/split-stress-controls-v1.json --out results/split-stress-ci --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_split_stress_report.py results/split-stress-ci/report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:N4DOMAINS_BIN batch --catalog-config configs/synthetic-batch.yaml --out results/batch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: git diff --exit-code -- schemas
