[workspace]
resolver = "2"
members = ["crates/nirs4all-domains", "crates/nirs4all-domains-cli"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dcornet/nirs4all-domains"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
nirs4all-preflight = "=0.1.0-alpha.1"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
