[package]
name = "nirs4all-domains"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset characterization, calibration readiness and domain shift assessment"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
native = ["dep:libloading", "dep:rand", "dep:rand_chacha"]
browser-wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
nirs4all-preflight.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
