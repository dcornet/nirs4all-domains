[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nirs4all-domains-bridge"
version = "0.2.0"
description = "Domains transport, validation interpretation and qualified structural descriptors"
requires-python = ">=3.11"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = ["PyYAML==6.0.3", "jsonschema>=4.23"]

[project.optional-dependencies]
datasets = ["nirs4all-datasets>=0.3,<0.4"]
predictive = ["dag-ml>=0.5,<0.6", "nirs4all-methods>=1.5.1,<1.6", "scikit-learn==1.7.2", "jsonschema>=4.23"]
test = ["pandas>=2.2", "numpy>=1.26", "jsonschema>=4.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nirs4all_domains*"]

[tool.setuptools.package-data]
nirs4all_domains = ["*.schema.json"]
